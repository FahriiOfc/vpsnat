services:
  # A Docker web service
  - type: web
    name: Ngrok
    env: docker
    repo: https://github.com/craxid/rairu-kun # optional
    region: Singapore # optional (defaults to Singapore)
    plan: free # optional (defaults to starter)
    healthCheckPath: /
    envVars:
      - key: 22 # ngrok port
        value: 22
      - key: 3LuThyLYolaMzACkKUIp7gJB7qU_6egkUoukoVvJu993Jdfe7 # ngrok token
        sync: false
      - key: Singapore # ngrok region
        sync: false
